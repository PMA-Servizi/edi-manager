services:
  frontend:
    container_name: edi-manager-fe
    build:
      context: ./edi-manager-fe
      target: ${NODE_ENV:-development}-stage
    networks:
      - edi-manager-network
    volumes:
      - ./edi-manager-fe:/app
      - /app/node_modules
    env_file:
      - .env
    expose:
      - "3000"
    restart: unless-stopped
  
  backend:
    container_name: edi-manager-be
    build:
      context: ./edi-manager-be
    networks:
      - edi-manager-network
    volumes:
      - ./edi-manager-be:/app
      - /app/node_modules
    env_file:
      - .env
    expose:
      - "4000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
  
  proxy:
    container_name: edi-manager-proxy
    build:
      context: ./edi-manager-infra
    ports:
      - ${APP_PORT:-8080}:80
    env_file:
      - .env
    depends_on:
      - frontend
      - backend
    volumes:
      - ./edi-manager-infra/templates:/etc/nginx/templates:ro
    networks:
      - edi-manager-network
    restart: unless-stopped
  
  db:
    image: postgres:17-alpine
    container_name: edi-manager-db
    networks:
      - edi-manager-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${INTERNAL_DB_PORT:-5432}:5432
    environment:
      - POSTGRES_PASSWORD=${INTERNAL_DB_PASSWORD}
      - POSTGRES_USER=${INTERNAL_DB_USERNAME}
      - POSTGRES_DB=${INTERNAL_DB_DATABASE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  redis:
    image: redis:7-alpine
    container_name: edi-manager-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    networks:
      - edi-manager-network
    volumes:
      - redis-data:/data
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    
volumes:
  postgres-data:
  redis-data:

networks:
  edi-manager-network: